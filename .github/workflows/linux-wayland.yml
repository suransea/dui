name: Linux Wayland

on:
  push:
  pull_request:

jobs:
  native-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Wayland SDK
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev wayland-protocols weston
      - name: Configure
        run: cmake -S . -B build/wayland -G Ninja -DCMAKE_BUILD_TYPE=Debug -DDUI_ENABLE_SANITIZERS=ON -DDUI_REQUIRE_WAYLAND_NATIVE=ON
      - name: Build
        run: cmake --build build/wayland --target dui_examples dui_wayland_state_tests dui_wayland_native_link_tests dui_wayland_native_window_tests
      - name: Examples, state, and link tests
        run: ctest --test-dir build/wayland -R 'dui_(.*_example|wayland_(state|native_link)_tests)' --output-on-failure
      - name: Headless Weston window test
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/dui-wayland-runtime"
          export WAYLAND_DISPLAY=dui-wayland-test
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 --scale=2 >"$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" || true' EXIT
          for attempt in {1..50}; do
            if [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
              break
            fi
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          ASAN_OPTIONS=detect_leaks=1 timeout 30s ./build/wayland/dui_wayland_native_window_tests
